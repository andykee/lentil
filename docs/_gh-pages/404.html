<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page not found - Lentil documentation</title>
    <script>
      // GitHub Pages serves this page for any missing path. The stable docs
      // used to live under /lentil/stable/ but are now served from the site
      // root, so send old stable/ links to the same page at the root.
      (function () {
        var match = window.location.pathname.match(/^\/lentil\/stable(\/.*)?$/);
        if (!match) return;
        window.location.replace('/lentil' + (match[1] || '/') + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Page not found. Go to the <a href="/lentil/">Lentil documentation</a>.</p>
  </body>
</html>
