# Builds the docs and publishes them to a subdirectory of the gh-pages branch:
#
#   push to master   -> latest/
#   push a v* tag    -> <version>/ (and the site root if it's the newest final release)
#   manual run       -> <version>/ for the given tag, or latest/ if left blank
#
# Each run only replaces its own subdirectory, so previously published
# versions are left in place. The newest release is also served directly
# from the site root, so https://andykee.github.io/lentil/ needs no redirect.
# docs/versions.json (read by the version switcher) and the site-wide files
# in docs/_gh-pages (404 page) are copied to the branch root on every run.
name: Publish docs

on:
  push:
    branches: ["main"]
    tags: ["v*"]

  # Allows you to run this workflow manually from the Actions tab, e.g. to
  # publish docs for an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.8.9). Leave blank to publish latest from the selected branch."
        required: false
        default: ""

permissions:
  contents: write

# Only one deployment at a time so concurrent pushes to gh-pages don't race
concurrency:
  group: "docs-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The workflow ref provides versions.json and docs/_gh-pages. Full
      # history is needed to list tags when deciding whether this build is the
      # stable release.
      - name: Checkout workflow ref
        uses: actions/checkout@v4
        with:
          path: meta
          fetch-depth: 0

      - name: Determine target
        id: target
        working-directory: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          else
            tag=""
          fi

          if [ -z "${tag}" ]; then
            ref="${GITHUB_SHA}"
            target="latest"
            stable="false"
          else
            if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[0-9a-z.]*$ ]]; then
              echo "::error::'${tag}' is not a release tag like v1.2.3"
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              echo "::error::Tag '${tag}' does not exist"
              exit 1
            fi
            ref="${tag}"
            target="${tag#v}"
            newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "${tag}" = "${newest}" ]; then stable="true"; else stable="false"; fi
          fi

          echo "Publishing ${ref} to ${target}/ (stable: ${stable})"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "stable=${stable}" >> "$GITHUB_OUTPUT"

      - name: Checkout docs source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: src
        run: |
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build
        working-directory: src/docs
        env:
          DOCS_VERSION: ${{ steps.target.outputs.target }}
        run: make clean && make html

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.target.outputs.ref }}
          TARGET: ${{ steps.target.outputs.target }}
          STABLE: ${{ steps.target.outputs.stable }}
        run: |
          set -euo pipefail
          : "${TARGET:?TARGET must be set}"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${remote}" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "${remote}" site
          else
            git init --initial-branch gh-pages site
            git -C site remote add origin "${remote}"
          fi

          rm -rf "site/${TARGET}"
          cp -R src/docs/_build/html "site/${TARGET}"
          if [ "${STABLE}" = "true" ]; then
            # Replace the previous release at the site root, keeping the
            # version directories and git metadata
            shopt -s dotglob
            for path in site/*; do
              name="${path#site/}"
              if [ "${name}" = ".git" ] || [ "${name}" = "latest" ] || [[ "${name}" =~ ^[0-9]+\.[0-9]+ ]]; then
                continue
              fi
              rm -rf "${path}"
            done
            shopt -u dotglob
            cp -R src/docs/_build/html/. site/
          fi

          # Site-wide files (404 page, .nojekyll)
          cp -R meta/docs/_gh-pages/. site/
          cp meta/docs/versions.json site/versions.json

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Publish ${TARGET} docs from ${REF}"
          git push origin gh-pages
